# Minimal CI: compile the workspace and run the library tests.
#
# Scope is deliberately small: library tests only.
name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT `RUSTFLAGS: -D warnings`. The tree currently has warnings,
  # so that would make this red on arrival and the first instinct would be to
  # switch CI off. Worth turning on once the tree is clean, as a separate call.

jobs:
  test:
    name: cargo test --workspace --lib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Check that the pinned toolchain is available before building.
      - name: Check toolchain
        run: |
          rustc --version
          cargo --version
          rustc -vV | grep -q 'release: 1\.\(8[5-9]\|9[0-9]\|[0-9]\{3\}\)' || {
            echo "::error::Rust >= 1.85 is required by the workspace"
            exit 1
          }

      # restore/save split, not actions/cache, deliberately: actions/cache only
      # writes on success, so a run that times out saves nothing and the NEXT run
      # is cold too. That is self-perpetuating - the first 30-minute timeout
      # guaranteed every later run would also time out. Saving with `if: always()`
      # breaks the cycle.
      - name: Restore cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Use release mode so the CPU kernels and field arithmetic run at a
      # representative speed.
      - name: Build
        run: cargo build --release --workspace --lib --locked

      - name: Test
        run: cargo test --release --workspace --lib --locked

      - name: Save cargo cache
        if: always()        # especially on timeout - see the note above
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
