# Compile the legacy libraries and check bounded independent inference acceptance.
#
# Scope is deliberately small. It is `--workspace --lib`, not `--workspace`,
# because `gpt2`, `gemma3` and `timesfm` each ship examples named `prove` and
# `bench` which all link to the same `target/debug/examples/prove` path. That
# collision makes a bare `cargo test --workspace` abort before any test runs.
# Renaming them is worth doing, but it changes documented commands, so it is
# left as a separate decision rather than folded in here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT `RUSTFLAGS: -D warnings`. The tree currently has warnings,
  # so that would make this red on arrival and the first instinct would be to
  # switch CI off. Worth turning on once the tree is clean, as a separate call.

jobs:
  test:
    name: cargo test --workspace --lib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the reviewed compiler/profile for the new
      # standalone proof protocol and its dependency set.
      - name: Check toolchain
        run: |
          rustc --version
          cargo --version

      # restore/save split, not actions/cache, deliberately: actions/cache only
      # writes on success, so a run that times out saves nothing and the NEXT run
      # is cold too. That is self-perpetuating - the first 30-minute timeout
      # guaranteed every later run would also time out. Saving with `if: always()`
      # breaks the cycle.
      - name: Restore cargo cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --release is REQUIRED, not an optimisation. In debug the WHIR/PCS tests in
      # zkie-core are pathologically slow - unoptimised field arithmetic - and the
      # suite consumes ~11 CPU-hours where release takes 35 s. On a 2-core runner
      # that is ~5.5 hours against any sane timeout, so debug CI could never pass
      # on any commit with any cache. Measured on a 32-thread box: 26 minutes and
      # still unfinished, 16 of 21 tests done, five individually past 60 s.
      - name: Build
        run: cargo build --release --workspace --lib --locked

      - name: Test
        run: cargo test --release --workspace --lib --locked

      - name: Save cargo cache
        if: always()        # especially on timeout - see the note above
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  verified-inference:
    name: independent verified inference acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned toolchain
        run: rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: verified-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Numeric, adversarial and separate-process acceptance
        run: bash scripts/check_verified.sh
