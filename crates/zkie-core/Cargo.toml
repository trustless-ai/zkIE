[package]
name = "zkie-core"
version = "0.1.0"
edition = "2021"
description = "zkIE shared types, artifacts, fixed-point helpers, and execution traits"
license = "Apache-2.0"

[dependencies]
p3-challenger = "0.7.0"
p3-commit = "0.7.0"
p3-dft = { version = "0.7.0", features = ["parallel"] }
p3-field = "0.7.0"
p3-goldilocks = "0.7.0"
p3-matrix = "0.7.0"
p3-maybe-rayon = { version = "0.7.0", features = ["parallel"] }
rayon = "1.10"
memmap2 = "0.9"
p3-multilinear-util = "0.7.0"
p3-poseidon2 = "0.7.0"
p3-symmetric = "0.7.0"
p3-util = "0.7.0"
rand = "0.10.1"
bincode = "1.3.3"
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"


[dev-dependencies]
p3-util = "0.7.0"

[features]
default = []
