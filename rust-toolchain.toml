# Pin the toolchain for everyone who builds this workspace.
#
# The workspace crates themselves are edition 2021, but the vendored
# crates/zkie-core/vendor/p3-merkle-tree (patched into the graph via the
# [patch.crates-io] entry in Cargo.toml) is edition 2024, and so are the
# p3-* 0.7.0 crates it depends on. Cargo refuses to even parse such a
# manifest before Rust 1.85, failing with:
#
#   feature `edition2024` is required
#   ... not stabilized in this version of Cargo (1.79.0 ...)
#
# The floor is higher than that in practice: p3-util 0.7.0 calls
# `MaybeUninit::assume_init_ref` on a slice, which is still unstable on
# 1.90 (`error[E0658]: use of unstable library feature
# `maybe_uninit_slice``) and only compiles on newer releases. 1.95.0 is used
# here because it is the oldest toolchain verified to build the whole graph.
#
# Keep this in sync with the check in .github/workflows/tests.yml.
[toolchain]
channel = "1.95.0"
