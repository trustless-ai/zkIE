[package]
name = "zkie"
version = "0.1.0"
edition = "2021"
description = "zkIE three-stage CLI and measurement harness"
license = "Apache-2.0"

[lib]
name = "zkie"
path = "src/lib.rs"

[[bin]]
name = "zkie"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
zkie-core = { path = "../crates/zkie-core" }
zkie-engine = { path = "../crates/zkie-engine" }
zkie-ops = { path = "../crates/zkie-ops" }
zkie-models-gpt2 = { path = "../models/gpt2" }
zkie-models-gemma3 = { path = "../models/gemma3" }
zkie-models-timesfm = { path = "../models/timesfm" }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
